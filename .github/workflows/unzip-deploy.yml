
name: Auto Unzip and Deploy

on:
  push:
    branches:
      - main
    paths:
      - project.zip
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. 获取仓库文件
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安全地解压 ZIP 到仓库根目录
      - name: Extract ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile
          import stat

          archive = Path("project.zip")

          if not archive.is_file():
              raise SystemExit("未找到 project.zip")

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  name = item.filename
                  path = PurePosixPath(name)

                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or "\\" in name
                      or not path.parts
                      or path.parts[0] in
                         {".git", ".github", "_site"}
                      or name.rstrip("/") == "project.zip"
                  ):
                      raise SystemExit(
                          f"ZIP 包含不允许的路径: {name}"
                      )

                  mode = item.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(
                          f"ZIP 包含符号链接: {name}"
                      )

              z.extractall(".")

          print("ZIP 已解压到仓库根目录")
          PY

      # 3. 提交解压后的项目文件
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Auto extract project"
            git push
          fi

      # 4. 安装 Node.js（有 package.json 时）
      - name: Setup Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 5. 准备网站文件
      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          if [[ -f package.json ]]; then

            if [[ -f package-lock.json ]]; then
              npm ci
            else
              npm install
            fi

            npm run build

            BUILD_DIR=""
            for dir in dist build out; do
              if [[ -f "$dir/index.html" ]]; then
                BUILD_DIR="$dir"
                break
              fi
            done

            if [[ -z "$BUILD_DIR" ]]; then
              echo "未找到可部署的构建目录"
              exit 1
            fi

            cp -a "$BUILD_DIR"/. _site/

          else

            if [[ ! -f index.html ]]; then
              echo "根目录不存在 index.html"
              exit 1
            fi

            rsync -a \
              --exclude=".git/" \
              --exclude=".github/" \
              --exclude="_site/" \
              --exclude="project.zip" \
              --exclude=".env*" \
              --exclude="node_modules/" \
              ./ _site/

          fi

      # 6. 配置 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 7. 上传网站文件
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # 8. 部署网站
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
